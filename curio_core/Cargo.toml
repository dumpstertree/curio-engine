[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[package]
name = "curio_core"
version = "0.1.0"
authors = ["dumpstertree@gmail.com"]
edition = "2018"

# [[bin]]
# name = "dumpster-engine"
# path = "src/lib.rs"


# [[example]]
# name = "my_game"
# path = "examples/my_game/main.rs"


# [lib]
# crate-type = ["cdylib", "rlib"]

# [profile.release]
# strip = true
# lto = true
# opt-level = 3

# [profile.dev]
# strip = false
# lto = false
# opt-level = 0


[dependencies]
# window
winit = { version = "0.30", features = ["android-native-activity"] }
# gui
egui = "0.31.1"
egui-wgpu = { version = "0.31.1", features = ["winit"] }
# physics
rapier3d = "0.25.1"
# mesh
gltf = "1.4.1"
mesh-tools = "0.4.0"
# utility
rand = "0.9.1"
cgmath = "0.18"
pollster = "0.3"
serde_json = "1.0.48"
serde_yaml = "0.9.34"
serde = { version = "1.0.104", features = ["derive"] }
bytemuck = { version = "1.16", features = ["derive"] }
# message-io = "0.19.0"
# rusty_spine = { path = "../../rusty_spine3.8" }
reqwest = { version = "0.12.23", features = ["blocking"] }
chrono = "0.4.42"
bincode = "1.3"
zip = "0.6"
rayon = "1.11.0"
log = "0.4.29"
simple_logger = "5"
downcast-rs = "2.0.1"
colored = "3.1.1"
libloading = "0.8"
image = { version = "0.24", default-features = false, features = ["jpeg"] }
