[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[package]
name = "curio_core"
version = "0.1.0"
authors = ["dumpstertree@gmail.com"]
edition = "2018"
build = "build.rs"


[dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
egui = "0.31.1"
egui-wgpu = { version = "0.31.1", features = ["winit"] }
rand = "0.9.1"
cgmath = "0.18"
serde_json = "1.0.48"
serde_yaml = "0.9.34"
serde = { version = "1.0.104", features = ["derive"] }
bytemuck = { version = "1.16", features = ["derive"] }
reqwest = { version = "0.12.23", features = ["blocking"] }
chrono = "0.4.42"
bincode = "1.3"
downcast-rs = "2.0.1"
colored = "3.1.1"
image = { version = "0.24", default-features = false, features = ["jpeg"] }


[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
