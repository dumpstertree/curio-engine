[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[package]
name = "examples"
version = "0.1.0"
edition = "2024"

[dependencies]

[dev-dependencies]
futures = "0.3"
hecs = "0.10.5"
mcts = "0.3.0"
pollster = "0.3"
rand = "0.9.1"
serde = { version = "1.0.104", features = ["derive", "rc"] }
stimulant = { workspace = true }
record = { workspace = true }
record_serializable = { workspace = true }
impulse = { workspace = true }
habit = { workspace = true }
facet = { workspace = true }
curio_core = { workspace = true }
time = { workspace = true }
input = { workspace = true }
physics = { workspace = true }
gameplay = { workspace = true }
networking = { workspace = true }
rendering = { workspace = true }
winit = { version = "0.30", features = ["android-native-activity"] }
ctor = "0.2"
strum = "0.26"
strum_macros = "0.26"
