[package]
name = "rendering_dynamic"
version = "0.1.0"
edition = "2024"


[dependencies]
time = { workspace = true }
facet = { workspace = true }
camera = { workspace = true }
habit = { workspace = true }
gameplay = { workspace = true }
curio_core = { workspace = true }
ext_rendering = { workspace = true }
rendering_static = { workspace = true }
record = { workspace = true }
serde = { version = "1.0.104", features = ["derive"] }
bytemuck = { version = "1.16", features = ["derive"] }
ctor = "0.8.0"
mint = "0.5"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
rayon = "1.11.0"
egui = "0.31.1"

[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg"]
