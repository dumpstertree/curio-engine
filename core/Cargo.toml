[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[package]
name = "core"
version = "0.1.0"
authors = ["dumpstertree@gmail.com"]
edition = "2018"

# [[bin]]
# name = "dumpster-engine"
# path = "src/lib.rs"


# [[example]]
# name = "my_game"
# path = "examples/my_game/main.rs"


# [lib]
# crate-type = ["cdylib", "rlib"]

# [profile.release]
# strip = true
# lto = true
# opt-level = 3

# [profile.dev]
# strip = false
# lto = false
# opt-level = 0


[dependencies]
# window
winit = { version = "0.30", features = ["android-native-activity"] }
# gameplay
hecs = "0.10.5"
# gui
egui = "0.31.1"
egui-winit = "0.31.1"
egui-wgpu = { version = "0.31.1", features = ["winit"] }
# physics
rapier3d = "0.25.1"
# mesh
gltf = "1.4.1"
mesh-tools = "0.4.0"
# utility
rand = "0.9.1"
cgmath = "0.18"
pollster = "0.3"
serde_json = "1.0.48"
serde = { version = "1.0.104", features = ["derive"] }
bytemuck = { version = "1.16", features = ["derive"] }
linkme = "=0.2.10"
intertrait = "0.2.2"
# editor
inline_tweak = "1.2.2"
ctor = "0.2"
message-io = "0.19.0"
rusty_spine = "0.8"

bincode = "1.3"
[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg"]
