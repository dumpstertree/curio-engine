[workspace]
members = [
    "curio_core",
    "curio_engine",
    "examples",
    "system_component_default/gameplay",
    "system_component_default/gameplay_macros/impulse",
    "system_component_default/gameplay_macros/habit",
    "system_component_default/gameplay_macros/stimulant",
    "system_component_default/gameplay_macros/facet",
    "system_component_default/gameplay_macros/record",
    "system_component_default/gameplay_macros/record_serializable",
    "system_component_default/rendering",
    "system_component_default/rendering_macros/macro_render_feature_driver",
    "system_component_default/time",
    "system_component_default/physics",
    "system_component_default/networking",
    "system_component_default/animation",

]

[workspace.dependencies]
curio_engine = { path = "curio_engine" }
curio_core = { path = "curio_core" }
record = { path = "system_component_default/gameplay_macros/record" }
record_serializable = { path = "system_component_default/gameplay_macros/record_serializable" }
stimulant = { path = "system_component_default/gameplay_macros/stimulant" }
impulse = { path = "system_component_default/gameplay_macros/impulse" }
habit = { path = "system_component_default/gameplay_macros/habit" }
facet = { path = "system_component_default/gameplay_macros/facet" }
gameplay = { path = "system_component_default/gameplay" }
rendering = { path = "system_component_default/rendering" }
networking = { path = "system_component_default/networking" }
physics = { path = "system_component_default/physics" }
input = { path = "system_component_default/input" }
time = { path = "system_component_default/time" }
animation = { path = "system_component_default/animation" }

[workspace.package]
version = "0.1.0"
edition = "2021"
