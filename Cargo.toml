[package]
name = "tutorial3-pipeline"
version = "0.1.0"
authors = ["Ben Hansen <https://github.com/sotrh>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
wgpu = "25.0"
pollster = "0.3"
bytemuck = { version = "1.16", features = [ "derive" ] }
cgmath = "0.18"
tobj = { version = "3.2", default-features = false, features = ["async"]}
gltf = "1.4.1"
serde = { version = "1.0.104", features = ["derive"] }
serde_json = "1.0.48" 
hecs = "0.10.5"
simple_event_bus = "0.0.5"
egui = "0.31.1"
eframe = "0.31.1"

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"
glob = "0.3"

 

 

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "25.0", features = ["webgl"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
]}

[profile.release]
strip = true
lto = true
opt-level = "z"

[[bin]]
name = "tutorial3-pipeline"
path = "src/main.rs"

[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg"]

